services:
  # Development-only inbox. This file must never be used for a production
  # deployment because it exposes every email received by the application.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
