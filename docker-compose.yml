x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      target: production
    env_file: .env
    init: true
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: .
      target: web
    # Keep the application private to the host. Terminate public TLS in a
    # managed load balancer or a host-level reverse proxy.
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    init: true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - storage-data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    init: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    init: true
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      target: production
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=60 --max-time=3600
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[p]hp artisan queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      target: production
    command: php artisan schedule:work
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[p]hp artisan schedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3

  test:
    build:
      context: .
      target: test
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 4
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    profiles: [tools]

volumes:
  mysql-data:
  redis-data:
  storage-data:
